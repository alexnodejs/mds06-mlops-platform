# values-prod.yaml — той самий чарт, інші значення.
#
# Це головна перевага Helm зі слайда 14: «повторюваний деплой».
# Один набір шаблонів обслуговує скільки завгодно середовищ.
#
# Тут перелічено ЛИШЕ те, що відрізняється від values.yaml —
# решту Helm візьме з дефолтного файлу (значення зливаються, а не заміщуються):
#   helm install ... -f values.yaml -f values-prod.yaml

replicaCount: 3 # у «проді» реплік більше

resources:
  requests:
    cpu: 100m # і ресурсів теж більше
    memory: 64Mi

page:
  accent: "#C62828" # червоний — щоб на екрані одразу було видно, що це prod
  title: "Helm · prod"
  lines:
    - "Той самий чарт, що й у dev."
    - "Відрізняється лише <code>values-prod.yaml</code>: 3 репліки замість 2."
    - "Жоден шаблон не змінювався."
