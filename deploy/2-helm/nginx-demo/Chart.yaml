# Chart.yaml — мета-інформація про чарт (слайд 27).
# На логіку деплою не впливає, але без нього Helm не вважає теку чартом.

# Версія формату чарту. v2 = Helm 3 і Helm 4. v1 — це старий Helm 2.
apiVersion: v2

# Імʼя чарту. Має збігатися з іменем теки, інакше `helm lint` попередить.
name: nginx-demo

# Лапки тут ОБОВʼЯЗКОВІ: без них YAML побачить «Теми 6:» і вирішить,
# що це вкладений ключ, а не текст. Помилка виглядає так:
#   error converting YAML to JSON: mapping values are not allowed in this context
description: "Демо-чарт до Теми 6: той самий nginx, але зібраний із шаблонів"

# application — звичайний чарт, який можна встановити.
# library — чарт лише з допоміжними шаблонами, встановити не можна.
type: application

# ⚠️ Два РІЗНІ поля, які студенти плутають найчастіше (слайд 27):
version: 0.1.0 # версія САМОГО ЧАРТУ — піднімайте при зміні шаблонів
appVersion: "1.29" # версія ДОДАТКУ всередині — тут версія nginx

keywords:
  - demo
  - lesson
