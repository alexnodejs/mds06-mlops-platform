# ══════════════════════════════════════════════════════════════════════════
# ROOT APPLICATION — патерн «app of apps»
# ══════════════════════════════════════════════════════════════════════════
#
# ЩО БУЛО. Кожен Application застосовувався руками:
#   kubectl apply -f argocd/app-minio.yaml
#   kubectl apply -f argocd/app-postgres.yaml
#   ... і так дев'ять разів, з трьох різних репозиторіїв
#
# Виходив парадокс: ArgoCD стежить, щоб у кластері було рівно те, що в Git,
# але САМІ Application-и в Git ніхто не звіряв. Видалили Application командою
# kubectl — і ArgoCD спокійно з цим погодився. Це дірка в GitOps рівно там,
# де він мав би працювати.
#
# ЩО СТАЛО. Один Application, який стежить за текою з рештою Application-ів:
#
#   kubectl apply -f argocd/root.yaml      <- одна команда на весь стек
#         │
#         └─► argocd/apps/  ──► monitoring, minio, postgres, loki, alloy,
#                                mlflow, ml-model, ml-dashboard, drift, react
#
# Тепер видалений вручну Application повертається сам (selfHeal), доданий у
# Git — зʼявляється без жодного kubectl, а `kubectl delete -f argocd/root.yaml`
# зносить увесь стек однією командою.
#
# ЧОМУ ЦЕ ПРАЦЮЄ: Application — такий самий ресурс Kubernetes, як Deployment.
# ArgoCD вміє синкати будь-який ресурс, зокрема й власний CRD. Рекурсії тут
# немає: root лежить у argocd/, а стежить за argocd/apps/.
# ══════════════════════════════════════════════════════════════════════════
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    # Без цього фіналайзера `kubectl delete application root` прибрав би лише
    # сам root, а десять дочірніх Application-ів (і весь стек під ними)
    # лишились би в кластері сиротами.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/alexnodejs/mds06-mlops-platform.git
    targetRevision: HEAD
    path: argocd/apps
    directory:
      # recurse: false — тека пласка, підтек немає. Явно вимикаємо, щоб
      # випадково створена підтека не поїхала в кластер.
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    # Application-и завжди живуть у namespace самого ArgoCD, незалежно від
    # того, в який namespace вони потім деплоять свої ресурси.
    namespace: argocd

  syncPolicy:
    automated:
      # prune: прибрали файл з argocd/apps/ у Git -> Application зникає з кластера.
      prune: true
      # selfHeal: хтось видалив Application через kubectl -> ArgoCD повертає його.
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m

# ──────────────────────────────────────────────────────────────────────────
# ПОРЯДОК РОЗГОРТАННЯ задають анотації sync-wave у самих дочірніх файлах.
# ArgoCD не почне хвилю N+1, доки всі Application-и хвилі N не стануть Healthy.
#
#   хвиля 0   monitoring (Prometheus+Grafana), minio, postgres   сховище і метрики
#   хвиля 1   loki, log-collector (Alloy), react-app             логи і демо GitOps
#   хвиля 2   mlflow, ml-model, ml-dashboard                     MLflow і модель
#   хвиля 3   drift-exporter                                     дріфт: потребує MLflow
#
# ⚠️ ПЕРЕДУМОВА, якої ArgoCD не забезпечить: Secret mlflow-credentials у
# namespace mlflow. Він створюється ПОЗА Git (у ньому паролі), командою
# `make secret` або першим кроком `make up`. Без нього Application-и minio,
# postgres і mlflow застрягнуть у Progressing.
# ──────────────────────────────────────────────────────────────────────────
