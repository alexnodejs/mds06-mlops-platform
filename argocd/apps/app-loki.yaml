# Loki 3.x у режимі SingleBinary, сховище filesystem на emptyDir.
#
# ЧОМУ НЕ grafana/loki-stack ЗІ СЛАЙДА 29:
#  1) чарт loki-stack 2.10.3 має deprecated=true, останній реліз 2023, тягне Loki 2.x;
#  2) його Promtail теж deprecated (Grafana замінила його на Alloy);
#  3) головне — loki-stack за замовчуванням просить PVC, а в цьому кластері
#     єдиний StorageClass gp2 сидить на вилученому in-tree провізіонері
#     kubernetes.io/aws-ebs (кластер 1.34, драйвера ebs.csi.aws.com немає),
#     тож PVC зависне в Pending НАЗАВЖДИ і под Loki разом із ним;
#  4) 16.03.2026 OSS-чарт Loki переїхав із grafana/ у grafana-community/
#     (те, що зараз лежить у grafana/loki 7.3.0 — це чарт для Grafana Enterprise Logs).
# Ідея слайда 29 лишається вірною, змінилися лише реалізації.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  annotations:
    # Черга розгортання: CRD Prometheus мусять приїхати ДО ServiceMonitor
    argocd.argoproj.io/sync-wave: "1"
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 18.7.6
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: SingleBinary

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
            filesystem:
              chunks_directory: /var/loki/chunks
              rules_directory: /var/loki/rules
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            # emptyDir живе рівно стільки, скільки под — тримати більше немає сенсу
            retention_period: 24h
            reject_old_samples: true
            reject_old_samples_max_age: 168h
            allow_structured_metadata: true
            volume_enabled: true
          compactor:
            working_directory: /var/loki/compactor
            retention_enabled: true
            delete_request_store: filesystem
          ingester:
            chunk_encoding: snappy
          querier:
            max_concurrent: 2
          pattern_ingester:
            enabled: false
          analytics:
            reporting_enabled: false

        singleBinary:
          replicas: 1
          persistence:
            enabled: false     # <- БЕЗ PVC. /var/loki стає emptyDir.
          sidecar: false
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 768Mi }

        # Мікросервісний режим вимкнено повністю
        write:   { replicas: 0 }
        read:    { replicas: 0 }
        backend: { replicas: 0 }

        chunksCache:  { enabled: false }   # дефолт просить 8 GiB пам'яті!
        resultsCache: { enabled: false }
        lokiCanary:   { enabled: false }
        test:         { enabled: false }
        gateway:      { enabled: false }   # тому datasource дивиться прямо в svc/loki:3100
        ruler:        { enabled: false }
        minio:        { enabled: false }
        monitoring:
          dashboards:    { enabled: false }
          rules:         { enabled: false }
          serviceMonitor: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
