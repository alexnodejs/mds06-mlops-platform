# Конфіг nginx для односторінкового застосунку (SPA).
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Головне правило для SPA ──────────────────────────────────────────
    # React-роутер обробляє шляхи на клієнті. Якщо користувач відкриє
    # /about напряму, на диску такого файлу немає — без цього рядка nginx
    # віддав би 404. try_files підсуває index.html, і React розбереться сам.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js генерується при старті контейнера і РІЗНИЙ у кожного пода.
    # Кешувати його не можна — інакше браузер покаже імʼя старого пода.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Файли з хешем у назві (index-a1b2c3.js) незмінні за визначенням —
    # їх можна кешувати надовго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Ендпоїнт для проб Kubernetes. Не пишемо в логи, щоб не засмічувати їх
    # запитами кожні 10 секунд.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
