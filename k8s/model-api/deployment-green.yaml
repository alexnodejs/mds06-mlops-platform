# GREEN — тіньовий варіант сервісу моделі. Тема 11, слайди 34-35.
# Анотацій prometheus.io/scrape НЕМАЄ свідомо — скрейпимо через ServiceMonitor
# (Prometheus Operator ігнорує ці анотації, це реліквія голого Prometheus).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-model-green
  namespace: ml-demo
  labels:
    app: ml-model-green
spec:
  # 0 реплік за замовчуванням: green потрібен ЛИШЕ на занятті, і той самий
  # ідіом уже діє для load-generator (loadgen.yaml). Вмикається `make bluegreen-up`.
  # Заодно це знімає питання «а чому под крутить модель із образу» — поки
  # аліаса @challenger немає, вмикати green немає сенсу.
  replicas: 0
  selector:
    matchLabels:
      # ⛔ НЕ ДОДАВАТИ СЮДИ variant. spec.selector ІМУТАБЕЛЬНИЙ: apply з новим
      # ключем впаде з "field is immutable", Application стане Failed — а
      # Service у тому ж коміті вже поїде на variant: blue. Результат:
      # порожні Endpoints і 100% помилок на /predict, поки хтось не помітить
      # червоний Application.
      #
      # Цього й не треба: селектор має бути ПІДМНОЖИНОЮ лейблів шаблона, а не
      # дорівнювати їм. Тому variant нижче додається без жодних наслідків.
      app: ml-model-green
  template:
    metadata:
      labels:
        # 🔴 САМЕ ml-model-green, а НЕ ml-model. Alloy кладе цей лейбл у мітку
        # Loki `app`, а дріфт-експортер Теми 9 читає рівно {app="ml-model"}.
        # Зі спільним app він змішав би прогнози champion і challenger в
        # одному хі-квадраті, а вікно 3000 записів подвоїлось би — при ліміті
        # Loki 5000 воно почало б мовчки обрізатись.
        app: ml-model-green
        # ⭐ Тема 11: мітка варіанту. Її читають ДВОЄ:
        #   Service ml-model  — вирішує, куди йде бойовий трафік;
        #   ServiceMonitor    — через podTargetLabels кладе її на КОЖНУ метрику
        #                       цього пода, тож blue і green видно окремо в
        #                       Grafana без жодної зміни app.py.
        variant: green
    spec:
      securityContext:
        # runAsNonRoot без runAsUser впаде, якщо в образі не заданий USER —
        # тому UID задаємо явно, це працює з будь-яким образом.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ml-model
          image: 832828869208.dkr.ecr.eu-central-1.amazonaws.com/mds06-ml-model:v6
          imagePullPolicy: IfNotPresent
          ports:
            # ІМ'Я порту обов'язкове: на нього посилається ServiceMonitor.
            - name: http
              containerPort: 8000
          env:
            # Без цього Python буферизує stdout блоками по 4-8 КБ і логи
            # прилітають ривками, а останній буфер при падінні пода губиться.
            - name: PYTHONUNBUFFERED
              value: "1"
            # Версія ОБРАЗУ (не моделі!). Тримаємо поруч із newTag у
            # kustomization.yaml — міняються разом. Спроба передати це
            # через --build-arg не працює: у Dockerfile немає ARG APP_VERSION,
            # і сервіс тихо лишався на дефолті "v1".
            - name: APP_VERSION
              value: "v4"
            # ⭐ PROMOTE У MLFLOW == ДЕПЛОЙ.
            # Задано MLFLOW_TRACKING_URI -> сервіс тягне модель з реєстру за
            # аліасом champion і сам перечитує його раз на MODEL_RELOAD_SECONDS.
            # Прибрали цю змінну -> працює на моделі, зашитій в образ (Тема 8).
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlflow.svc.cluster.local:80
            - name: MLFLOW_MODEL_NAME
              value: iris-rf
            # ⭐ ЄДИНА ЗМІСТОВНА ВІДМІННІСТЬ ВІД BLUE: green бере КАНДИДАТА.
            # Саме тому blue-green тут не «дві копії того самого», а
            # порівняння двох різних моделей на однаковому трафіку.
            - name: MLFLOW_MODEL_ALIAS
              value: challenger
            - name: MODEL_RELOAD_SECONDS
              value: "30"
          # sklearn імпортується ~3-5 с, тому readiness має запас 30 с,
          # а liveness стартує пізніше, щоб не вбити под під час старту.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          # Креденшели до MinIO — модель лежить там як артефакт MLflow.
          # optional: true ОБОВʼЯЗКОВЕ: цей Secret створюється в namespace
          # mlflow (див. k8s/drift-exporter/secret-example.yaml), а под живе
          # в ml-demo — тут його НЕМА. Без optional kubelet не створює
          # контейнер узагалі: под вічно висить у CreateContainerConfigError
          # з "secret mlflow-credentials not found", і Тема 8 (моніторинг без
          # MLflow) не піднімається взагалі. З optional под стартує на моделі,
          # зашитій в образ; у логах буде model_reload_failed від MinIO.
          # Щоб запрацював promote == деплой, скопіюйте Secret у ml-demo:
          #   kubectl get secret mlflow-credentials -n mlflow -o yaml \
          #     | sed 's/namespace: mlflow/namespace: ml-demo/' | kubectl apply -f -
          envFrom:
            - secretRef:
                name: mlflow-credentials
                optional: true

          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
