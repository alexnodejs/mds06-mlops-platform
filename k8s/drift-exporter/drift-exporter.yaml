# ═══════════════════════════════════════════════════════════════════════════
#  ДРІФТ-ЕКСПОРТЕР — та сама стрілка «-> Prometheus» зі слайда 35.
#
#  Слайд 35 обіцяє «Evidently аналізує дані -> віддає статистику в Prometheus».
#  Скажемо студентам прямо: ТАКОЇ СТРІЛКИ НЕ ІСНУЄ в жодній версії Evidently.
#  Модуль evidently.model_monitoring, на якому побудовані ВСІ туторіали
#  «Evidently + Prometheus + Grafana», вилучено (немає вже у 0.6.5), а API
#  0.7.21 змінився повністю. Цикл опитування, Gauge-и, /metrics — це однаково
#  пише інженер. Саме тому в гарячому шляху у нас scipy.stats (ks_2samp +
#  chisquare, ~40 рядків, які студент читає повністю), а Evidently лишається
#  окремим лабораторним кроком, де він реально виграє: report.save_html()
#  -> артефакт MLflow у MinIO.
#
#  СХЕМА: Loki (query_range, вікно 10 хв) -> json.loads кожного рядка
#          -> ks_2samp vs еталон (4 ознаки) + chisquare (класи)
#          -> Gauge -> /metrics:9100 -> ServiceMonitor -> Prometheus -> Grafana.
#
#  ЧОМУ ДЖЕРЕЛО — LOKI, а не спільний буфер чи сайдкар: модель Теми 8 УЖЕ
#  логує кожен запит рядком JSON з повним input, Alloy УЖЕ складає ці рядки
#  в Loki. Дані вже лежать там, де нам треба — нуль нового коду в Темі 8.
#  Свідома межа: Loki у нас на emptyDir, тож рестарт його пода стирає
#  історію. Для вікна 10 хвилин це неважливо; у продакшні Loki мав би том.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drift-exporter
  namespace: mlflow
  labels:
    app: drift-exporter
spec:
  replicas: 1
  # Recreate, а не дефолтний RollingUpdate: у кластері рівно 34 слоти подів
  # і всі зайняті. RollingUpdate підняв би транзієнтний другий под, який
  # став би Pending і заблокував редеплой. Ціна — ~10 с без метрик.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: drift-exporter
  template:
    metadata:
      labels:
        app: drift-exporter
    spec:
      securityContext:
        # runAsNonRoot без runAsUser впаде, якщо в образі не заданий USER —
        # тому UID задаємо явно, це працює з будь-яким образом.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: drift-exporter
          image: 832828869208.dkr.ecr.eu-central-1.amazonaws.com/mds06-mlflow-tools:v5
          # Always, а не IfNotPresent (граблі №6 попередніх тем): з кешем ноди
          # ви годину дебажите код, який давно виправили.
          imagePullPolicy: Always
          # drift_exporter.py лежить у WORKDIR образу mds06-mlflow-tools.
          command: ["python", "drift_exporter.py"]
          ports:
            # ІМ'Я порту обов'язкове: на нього посилається ServiceMonitor.
            - name: http
              containerPort: 9100
          # ДО ТЕМИ 11 креденшелів тут не було взагалі: еталон брався з
          # load_iris() у самому образі. Тема 11 перенесла дані в сховище, і
          # тепер еталон читається звідти — інакше він описував би інший
          # розподіл, ніж той, на якому вчилась модель, і KS-тест показував би
          # дріфт на спокійному трафіку.
          #
          # ⚠️ optional: true СВІДОМО. Секрет живе в namespace mlflow разом із
          # експортером, але якщо його чомусь немає — под мусить піднятись і
          # працювати на вбудованому еталоні, а не впасти в
          # CreateContainerConfigError. Фолбек гучний: подія reference_fallback
          # у лозі й метрика reference_source{source="builtin"}.
          envFrom:
            - secretRef:
                name: mlflow-credentials
                optional: true
          env:
            # Без цього Python буферизує stdout блоками по 4-8 КБ і логи
            # прилітають ривками, а останній буфер при падінні пода губиться.
            - name: PYTHONUNBUFFERED
              value: "1"
            # ⭐ Тема 11: еталон береться з того самого CSV, на якому вчилась
            # модель. Порожнє значення повернуло б поведінку до Теми 9
            # (вбудований load_iris) — і еталон розійшовся б із тренуванням.
            - name: DATASET_URI
              value: s3://datasets/iris/v2.csv
            # Loki живе в іншому namespace — ходимо повним FQDN.
            - name: LOKI_URL
              value: http://loki.logging.svc.cluster.local:3100
            - name: LOKI_QUERY
              value: '{app="ml-model"} |= "predict"'
            # 10 хв * 5 RPS = 3000 записів, ліміт Loki 5000 -> запас ~1.7x.
            - name: WINDOW_MINUTES
              value: "10"
            - name: CHECK_INTERVAL
              value: "60"
            # 0.01, а НЕ підручникові 0.05 — ЗАМІРЯНО на 200 вікнах:
            # KS дав 0/200 хибних при обох порогах, хі-квадрат 12/200 (6%)
            # при 0.05 і 4/200 (2%) при 0.01. При alpha=0.05 тест ПО
            # ВИЗНАЧЕННЮ бреше у 5% випадків — за годину заняття це ~3
            # червоні панелі на чистих даних. Реальний дріфт дає p ~ 1e-11,
            # тож запас лишається дев'ять порядків.
            - name: P_THRESHOLD
              value: "0.01"
            # KS на 5 точках — не тест, а генератор випадкових чисел.
            # Нижче межі не рахуємо і НЕ скидаємо drift_detected у 0:
            # інакше при паузі трафіку дашборд «зеленіє» і бреше.
            - name: MIN_SAMPLES
              value: "30"
          # /metrics віддає сам prometheus_client.start_http_server —
          # ні FastAPI, ні uvicorn тут не потрібні.
          readinessProbe:
            httpGet: { path: /metrics, port: http }
            # numpy + scipy + sklearn імпортуються ~3-5 с, даємо запас 30 с.
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /metrics, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          # 128Mi requests / 256Mi limits, і 64Mi тут БУЛО Б ПОМИЛКОЮ
          # (граблі №1: сайдкари Grafana тихо гинули по OOMKilled на 64Mi,
          # под показував Running, а READY був 1/3). Обґрунтування числа:
          # самі імпорти numpy 2.5.2 + scipy 1.18 + sklearn 1.9 дають
          # ~110-130 MiB RSS ЩЕ ДО першого запиту, плюс вікно до 5000
          # JSON-рядків (~4 MiB) і копії масивів усередині ks_2samp.
          # 256Mi = приблизно двократний запас над робочим RSS.
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 200m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
# ClusterIP 9100 -> 9100. Порт ОБОВ'ЯЗКОВО іменований: ServiceMonitor
# посилається на ІМ'Я порту Service, з безіменним портом таргет не з'явиться.
apiVersion: v1
kind: Service
metadata:
  name: drift-exporter
  namespace: mlflow
  labels:
    app: drift-exporter # за цим лейблом Service знаходить ServiceMonitor
spec:
  type: ClusterIP
  selector:
    app: drift-exporter
  ports:
    - name: http
      port: 9100
      targetPort: http
      protocol: TCP
---
# ПАСТКА №1 (граблі №3 попередніх тем, найдорожча): за замовчуванням
# kube-prometheus-stack рендерить
#   serviceMonitorSelector: { matchLabels: { release: monitoring } }
# і ServiceMonitor БЕЗ цього лейбла ігнорується МОВЧКИ — ні помилки, ні
# події, просто немає таргета в /targets. У values Теми 8 вимкнено
# serviceMonitorSelectorNilUsesHelmValues, тож селектор порожній ({} = «всі»),
# але лейбл release: monitoring лишаємо — щоб файл працював і з дефолтними
# values, якщо хтось їх поверне.
#
# ПАСТКА №2: spec.selector.matchLabels має збігатися з лейблами SERVICE
# (не Deployment і не пода), а endpoints[].port — це ІМ'Я порту в Service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: drift-exporter
  namespace: mlflow
  labels:
    app: drift-exporter
    release: monitoring
spec:
  selector:
    matchLabels:
      app: drift-exporter
  namespaceSelector:
    matchNames: [mlflow]
  endpoints:
    - port: http # ІМ'Я порту Service, не номер
      path: /metrics
      # 30 с при CHECK_INTERVAL=60 с: Gauge оновлюється рідше за скрейп,
      # тому графік буде «сходинками» — так і має бути.
      interval: 30s
