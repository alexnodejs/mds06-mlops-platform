# ═══════════════════════════════════════════════════════════════════════════
#  ⚠️  ШАБЛОН (Example). У Git НЕ ЛЕЖИТЬ І НЕ МОЖЕ ЛЕЖАТИ ЖОДНОГО РЕАЛЬНОГО
#      ПАРОЛЯ. Усі значення нижче — заглушки, які ви ЗАМІНІТЬ у себе локально.
#
#  Цей файл НАВМИСНО не входить у kustomization.yaml -> ArgoCD його НЕ бачить
#  і НЕ застосовує. Він тут як документація: показує, які саме 11 ключів
#  очікують чарти MinIO / PostgreSQL / MLflow (слайд 23 — «усі креденшели
#  в ОДНОМУ об'єкті Kubernetes»).
#
#  ЯК СТВОРИТИ СПРАВЖНІЙ ОБ'ЄКТ У КЛАСТЕРІ (ідемпотентно, поза Git):
#  Скопіюйте чотири рядки нижче в термінал. openssl генерує паролі локально,
#  тому вони не потрапляють ні в історію Git, ні в цей файл.
#
#   kubectl create namespace mlflow --dry-run=client -o yaml | kubectl apply -f -
#   MINIO_PW=$(openssl rand -hex 16)
#   PG_PW=$(openssl rand -hex 16)
#   PG_SUPER=$(openssl rand -hex 16)
#   kubectl -n mlflow create secret generic mlflow-credentials --from-literal=rootUser=mlflowadmin --from-literal=rootPassword="$MINIO_PW" --from-literal=AWS_ACCESS_KEY_ID=mlflowadmin --from-literal=AWS_SECRET_ACCESS_KEY="$MINIO_PW" --from-literal=POSTGRES_DB=mlflow --from-literal=POSTGRES_USER=mlflow --from-literal=POSTGRES_PASSWORD="$PG_PW" --from-literal=POSTGRES_POSTGRES_PASSWORD="$PG_SUPER" --from-literal=MLFLOW_TRACKING_URI=http://mlflow.mlflow.svc.cluster.local:80 --from-literal=MLFLOW_S3_ENDPOINT_URL=http://minio.mlflow.svc.cluster.local:9000 --from-literal=AWS_DEFAULT_REGION=eu-central-1 --dry-run=client -o yaml | kubectl apply -f -   # Example
#
#  ЧОМУ ЦЕЙ ОБ'ЄКТ НЕ ПІД ArgoCD: у нього немає лейбла
#  argocd.argoproj.io/instance, тож prune: true у дочірніх Application його
#  не знесе. Створюємо ОДИН раз, ДО першого синку.
#
#  ПРОДАКШН-АЛЬТЕРНАТИВА (слайд 23) — щоб УВЕСЬ репозиторій був під GitOps:
#  External Secrets Operator замість цього Example. Він матеріалізує в
#  кластері рівно той самий об'єкт mlflow-credentials з тими самими 11
#  ключами, але значення тягне з менеджера секретів AWS — авторизація через
#  IRSA / Pod Identity, тобто без ключів у кластері взагалі (Example виклику:
#  `dataFrom: [{extract: {key: mds06/mlflow}}]` — один шлях, усі 11 ключів).
#  У Git тоді лежить лише посилання на шлях, а значень немає.
#  HashiCorp Vault із власним оператором — той самий патерн, інший бекенд.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret # ЗАМІНІТЬ усі заглушки нижче; заповнений файл НЕ комітити
metadata:
  name: mlflow-credentials
  namespace: mlflow
type: Opaque
stringData:
  # ── MinIO ────────────────────────────────────────────────────────────────
  # Обидва ключі нижче ЗАШИТІ в шаблони чарта minio 5.4.0 — він читає їх і як
  # змінні оточення MINIO_ROOT_*, і як файли /config/rootUser у post-install
  # Job з mc. Перейменувати НЕ можна.
  rootUser: mlflowadmin # -> env MINIO_ROOT_USER
  # МІНІМУМ 8 символів, інакше MinIO навіть не стартує.
  rootPassword: ЗАМІНІТЬ--openssl-rand-hex-16 # -> env MINIO_ROOT_PASSWORD

  # ── S3-креденшели (це ті самі root-креденшели MinIO) ─────────────────────
  # Читає і сервер MLflow (artifactRoot.s3.existingSecret), і КЛІЄНТ
  # (тренувальний Job): при proxiedArtifactStorage: false артефакти
  # вантажить клієнт НАПРЯМУ в MinIO, минаючи MLflow.
  AWS_ACCESS_KEY_ID: mlflowadmin
  AWS_SECRET_ACCESS_KEY: ЗАМІНІТЬ--те-саме-значення-що-в-rootPassword

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  # Ці ключі читає чарт groundhog2k/postgres (блок userDatabase) і створює
  # БД + користувача при ПЕРШОМУ старті. Ті самі два читає й MLflow
  # (блок backendStore) — див. коментарі в argocd/app-*.yaml.
  # Сам --backend-store-uri=postgresql:// йде БЕЗ креденшелів: libpq збирає
  # підключення з PG*-змінних, тому пароль не світиться ні в args пода,
  # ні в `kubectl describe pod`.
  POSTGRES_DB: mlflow # -> env POSTGRES_DB
  POSTGRES_USER: mlflow # -> env USERDB_USER у Postgres, PGUSER у MLflow
  POSTGRES_PASSWORD: ЗАМІНІТЬ--openssl-rand-hex-16 # -> USERDB_PASSWORD / PGPASSWORD
  # Суперюзер postgres: офіційний образ без цього значення не запуститься.
  # MLflow ним НЕ користується — має бути ІНШИМ, ніж попереднє.
  POSTGRES_POSTGRES_PASSWORD: ЗАМІНІТЬ--інший-openssl-rand-hex-16

  # ── Не креденшели, але лежать тут навмисно ───────────────────────────────
  # Щоб клієнту (тренувальний Job, ноутбук) вистачило ОДНОГО
  # envFrom замість шести окремих env. Три рядки YAML замість двадцяти.
  MLFLOW_TRACKING_URI: http://mlflow.mlflow.svc.cluster.local:80
  # Без цієї змінної boto3 у клієнті піде в справжній s3.amazonaws.com
  # і впаде на NoSuchBucket — найпоширеніша помилка цієї теми.
  MLFLOW_S3_ENDPOINT_URL: http://minio.mlflow.svc.cluster.local:9000
  # MinIO значення ігнорує, але boto3 без регіону кидає NoRegionError
  # на кастомному endpoint — потрібне лише для підпису SigV4.
  AWS_DEFAULT_REGION: eu-central-1
